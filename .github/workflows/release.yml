name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check module.json version matches tag
        run: |
          VERSION=$(jq -r .version module.json)
          if [ "$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "module.json version ($VERSION) does not match tag ($GITHUB_REF_NAME)"
            exit 1
          fi
          jq -e --arg tag "$GITHUB_REF_NAME" '.download | endswith("/download/" + $tag + "/foundryvtt-sidebar-resizer_" + $tag + ".zip")' module.json

      - name: Build zip
        run: zip foundryvtt-sidebar-resizer_${GITHUB_REF_NAME}.zip module.json sidebar-resizer.js README.md CHANGELOG.md LICENSE.md THANKS.txt

      - name: Extract changelog entry
        run: awk -v v="# $GITHUB_REF_NAME" '$0==v{f=1;next} /^#/{f=0} f' CHANGELOG.md > release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            module.json
            foundryvtt-sidebar-resizer_${{ github.ref_name }}.zip
