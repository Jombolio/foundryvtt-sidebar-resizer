name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  # Manual run from master: tags the current commit with module.json's version and releases it
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'push' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG=$(jq -r .version module.json)
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
              echo "Tag $TAG already exists; bump the version in module.json first"
              exit 1
            fi
          else
            TAG=$GITHUB_REF_NAME
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Check module.json version matches tag
        run: |
          VERSION=$(jq -r .version module.json)
          if [ "$VERSION" != "$TAG" ]; then
            echo "module.json version ($VERSION) does not match tag ($TAG)"
            exit 1
          fi
          jq -e --arg tag "$TAG" '.download | endswith("/download/" + $tag + "/foundryvtt-sidebar-resizer_" + $tag + ".zip")' module.json

      - name: Build zip
        run: zip foundryvtt-sidebar-resizer_${TAG}.zip module.json sidebar-resizer.js README.md CHANGELOG.md LICENSE.md THANKS.txt

      - name: Extract changelog entry
        run: awk -v v="# $TAG" '$0==v{f=1;next} /^#/{f=0} f' CHANGELOG.md > release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.TAG }}
          body_path: release-notes.md
          files: |
            module.json
            foundryvtt-sidebar-resizer_${{ env.TAG }}.zip
